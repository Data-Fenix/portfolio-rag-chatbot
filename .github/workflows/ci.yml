name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (no network)
        run: pytest
      - name: Retrieval evals (deterministic gate)
        run: python -m evals.run_evals --retrieval-only

  # Answer-quality evals cost tokens, so they run only on main with the secret present.
  answer-evals:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    # Skips cleanly until the ANTHROPIC_API_KEY repository secret is added.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: LLM-as-judge evals
        if: env.ANTHROPIC_API_KEY != ''
        run: python -m evals.run_evals
      - uses: actions/upload-artifact@v4
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: eval-report
          path: evals/last_report.json
